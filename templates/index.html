<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Downloader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0d0d;
      --surface:  #161616;
      --border:   #2a2a2a;
      --accent:   #6c63ff;
      --accent2:  #a78bfa;
      --text:     #e8e8e8;
      --muted:    #777;
      --success:  #4ade80;
      --error:    #f87171;
      --radius:   10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    header p {
      color: var(--muted);
      margin-top: 6px;
      font-size: 13px;
    }

    .card {
      width: 100%;
      max-width: 640px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    .card + .card { margin-top: 20px; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 14px;
      padding: 10px 14px;
      outline: none;
      transition: border-color .15s;
    }

    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--muted); }

    select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 13px;
      padding: 10px 12px;
      outline: none;
      cursor: pointer;
      transition: border-color .15s;
    }

    select:focus { border-color: var(--accent); }

    textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 11.5px;
      padding: 10px 14px;
      outline: none;
      resize: vertical;
      transition: border-color .15s;
      min-height: 120px;
    }

    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }

    button {
      background: var(--accent);
      border: none;
      border-radius: 7px;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 20px;
      transition: opacity .15s, transform .1s;
      white-space: nowrap;
    }

    button:hover { opacity: .88; }
    button:active { transform: scale(.97); }
    button:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    /* Progress section */
    #progress-section { display: none; }

    .progress-bar-wrap {
      background: var(--bg);
      border-radius: 999px;
      height: 6px;
      overflow: hidden;
      margin: 14px 0 8px;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 999px;
      transition: width .3s ease;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
    }

    #log-box {
      margin-top: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 12px 14px;
      max-height: 180px;
      overflow-y: auto;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.6;
    }

    #log-box .line { display: block; }
    #log-box .line.err { color: var(--error); }
    #log-box .line.ok  { color: var(--success); }

    #status-msg {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
    }

    #status-msg.done  { color: var(--success); }
    #status-msg.error { color: var(--error); }

    /* File list */
    #files-section h2 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    #file-list { list-style: none; }

    #file-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    #file-list li:last-child { border-bottom: none; }

    .file-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }

    .file-size { color: var(--muted); font-size: 12px; flex-shrink: 0; }

    .play-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--success);
      font-size: 12px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .play-btn:hover { border-color: var(--success); background: rgba(74,222,128,.08); opacity: 1; }

    .dl-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--accent2);
      font-size: 12px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 5px;
      flex-shrink: 0;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .dl-btn:hover { border-color: var(--accent); opacity: 1; background: var(--border); }

    .del-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--error);
      font-size: 12px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .del-btn:hover { border-color: var(--error); background: rgba(248,113,113,.1); opacity: 1; }

    .hide-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 15px;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .hide-btn:hover { color: var(--text); background: var(--border); opacity: 1; }

    .file-ext {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--accent2);
      background: rgba(167,139,250,.12);
      border: 1px solid rgba(167,139,250,.25);
      border-radius: 4px;
      padding: 2px 6px;
    }

    #empty-msg { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0; }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .refresh-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 5px;
    }

    .refresh-btn:hover { color: var(--text); border-color: var(--accent); opacity: 1; }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      font-size: 13px;
      color: var(--muted);
      user-select: none;
      cursor: pointer;
    }

    .checkbox-row input[type="checkbox"] {
      accent-color: var(--accent);
      width: 14px;
      height: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .stop-btn {
      background: transparent;
      border: 1px solid var(--error);
      color: var(--error);
      font-size: 12px;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 5px;
    }

    .stop-btn:hover { background: rgba(248,113,113,.15); opacity: 1; }

    .progress-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .progress-header label { margin-bottom: 0; }

    /* Cookies section */
    details.cookies-section {
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 0;
    }

    details.cookies-section summary {
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 10px 14px;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }

    details.cookies-section summary::-webkit-details-marker { display: none; }
    details.cookies-section summary::before {
      content: "▶";
      font-size: 9px;
      transition: transform .15s;
    }

    details.cookies-section[open] summary::before { transform: rotate(90deg); }

    .cookies-body {
      padding: 0 14px 14px;
    }

    .cookies-status {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      margin-left: auto;
    }

    .cookies-status.active {
      color: var(--success);
      background: rgba(74,222,128,.12);
      border: 1px solid rgba(74,222,128,.25);
    }

    .cookies-status.inactive {
      color: var(--muted);
    }

    .ghost-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 6px;
    }

    .ghost-btn:hover { color: var(--text); border-color: var(--accent); opacity: 1; }

    .danger-ghost-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--error);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 6px;
    }

    .danger-ghost-btn:hover { border-color: var(--error); background: rgba(248,113,113,.08); opacity: 1; }

    /* Media player modal */
    #player-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #player-modal.open { display: flex; }

    .player-inner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 860px;
      position: relative;
    }

    .player-close {
      position: absolute;
      top: 12px;
      right: 14px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 20px;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }

    .player-close:hover { color: var(--text); background: var(--border); opacity: 1; }

    #player-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      padding-right: 40px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 14px;
    }

    #player-container video,
    #player-container audio {
      width: 100%;
      border-radius: 6px;
      outline: none;
      max-height: 65vh;
    }

    ::cue {
      background-color: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-family: "YouTube Noto", Roboto, Arial, sans-serif;
      font-size: 1em;
      line-height: 1.4;
      padding: 0.1em 0.35em;
      border-radius: 2px;
      white-space: pre-wrap;
      text-align: center;
    }
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e1e2e;
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      white-space: nowrap;
      z-index: 9999;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div id="toast"></div>
  <header>
    <h1>Video Downloader</h1>
    <p>Powered by yt-dlp &mdash; saves to your server&rsquo;s downloads folder</p>
  </header>

  <!-- Download form -->
  <div class="card">
    <label for="url-input">Video URL</label>
    <div class="input-row" style="margin-bottom:14px">
      <input id="url-input" type="text" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" spellcheck="false" />
    </div>
    <label class="checkbox-row" for="no-playlist">
      <input type="checkbox" id="no-playlist" />
      Single video only (skip playlist)
    </label>
    <label class="checkbox-row" for="embed-subs">
      <input type="checkbox" id="embed-subs" />
      Subtitles (download &amp; embed into file)
    </label>
    <label class="checkbox-row" for="auto-delete">
      <input type="checkbox" id="auto-delete" />
      Auto-delete from server after saving
    </label>
    <label class="checkbox-row" id="stream-row" for="stream-to-client">
      <input type="checkbox" id="stream-to-client" />
      Download directly to device (no server storage)
    </label>
    <div class="input-row" style="margin-bottom:14px;gap:10px">
      <div style="flex:1;min-width:0">
        <label for="quality-select" style="margin-bottom:6px">Quality</label>
        <select id="quality-select" style="width:100%" onchange="updateFormatOptions()">
          <option value="best">Best available</option>
          <option value="4k">4K (2160p)</option>
          <option value="1080">1080p</option>
          <option value="720">720p</option>
          <option value="480">480p</option>
          <option value="360">360p</option>
          <option value="audio">Audio only</option>
        </select>
      </div>
      <div style="flex:1;min-width:0">
        <label for="format-select" style="margin-bottom:6px">Container</label>
        <select id="format-select" style="width:100%">
          <option value="mp4">MP4</option>
          <option value="mkv">MKV</option>
          <option value="webm">WebM</option>
        </select>
      </div>
    </div>

    <!-- Cookies section -->
    <details class="cookies-section" id="cookies-details">
      <summary>
        Cookies
        <span id="cookies-badge" class="cookies-status inactive">None</span>
      </summary>
      <div class="cookies-body">
        <label style="margin-bottom:6px;margin-top:0">Paste cookies.txt content</label>
        <textarea id="cookies-text" placeholder="# Netscape HTTP Cookie File&#10;.youtube.com	TRUE	/	TRUE	..."></textarea>
        <div style="display:flex;gap:8px;margin-top:10px;align-items:center">
          <button class="ghost-btn" onclick="saveCookies()">Save Cookies</button>
          <button class="danger-ghost-btn" onclick="clearCookies()">Clear</button>
        </div>
      </div>
    </details>

    <div class="input-row" style="justify-content:flex-end;margin-top:14px">
      <button id="dl-btn" onclick="startDownload()">Download</button>
    </div>
  </div>

  <!-- Progress -->
  <div class="card" id="progress-section">
    <div class="progress-header">
      <label>Progress</label>
      <button id="stop-btn" class="stop-btn" onclick="stopDownload()" style="display:none">Stop</button>
    </div>
    <div class="progress-bar-wrap">
      <div id="progress-bar"></div>
    </div>
    <div class="progress-meta">
      <span id="prog-percent">0%</span>
      <span id="prog-speed"></span>
      <span id="prog-eta"></span>
      <span id="prog-size"></span>
    </div>
    <div id="log-box"></div>
    <div id="status-msg"></div>
  </div>

  <!-- Downloaded files -->
  <div class="card" id="files-section">
    <div class="section-header">
      <h2>Downloaded Files</h2>
      <button class="refresh-btn" onclick="loadFiles()">Refresh</button>
    </div>
    <ul id="file-list"></ul>
    <p id="empty-msg" style="display:none">No files yet.</p>
  </div>

  <!-- Media player modal -->
  <div id="player-modal">
    <div class="player-inner">
      <button class="player-close" onclick="closePlayer()">&#x2715;</button>
      <div id="player-title"></div>
      <div id="player-container"></div>
    </div>
  </div>

  <script>
    let currentSource = null;
    let currentJobId = null;
    const hiddenFiles = new Set();

    const AUDIO_EXTS = new Set(["mp3", "aac", "m4a", "flac", "opus", "wav", "ogg"]);
    const PLAYABLE_EXTS = new Set(["mp4", "webm", "mp3", "aac", "m4a", "flac", "opus", "wav", "ogg"]);

    // ── Toast ────────────────────────────────────────────────────────────────
    let _toastTimer = null;
    function showToast(msg, duration = 3000) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => el.classList.remove("show"), duration);
    }

    // ── Format options ───────────────────────────────────────────────────────
    function updateFormatOptions() {
      const quality = document.getElementById("quality-select").value;
      const sel = document.getElementById("format-select");
      const prev = sel.value;
      if (quality === "audio") {
        sel.innerHTML = '<option value="best">Original (no re-encode)</option><option value="mp3">MP3</option><option value="aac">AAC</option><option value="m4a">M4A</option><option value="flac">FLAC</option>';
      } else {
        sel.innerHTML = '<option value="mp4">MP4</option><option value="mkv">MKV</option><option value="webm">WebM</option>';
        if (sel.querySelector(`option[value="${prev}"]`)) sel.value = prev;
      }
    }

    // ── Download ─────────────────────────────────────────────────────────────
    async function startDownload() {
      const url = document.getElementById("url-input").value.trim();
      if (!url) { alert("Please enter a URL."); return; }

      const quality = document.getElementById("quality-select").value;
      const fmt = document.getElementById("format-select").value;
      const noPlaylist = document.getElementById("no-playlist").checked;
      const embedSubs = document.getElementById("embed-subs").checked;
      const streamToClient = document.getElementById("stream-to-client").checked;
      const btn = document.getElementById("dl-btn");

      // Domain support pre-check — warn before touching any other UI
      try {
        const checkRes = await fetch(`/api/check-url?url=${encodeURIComponent(url)}`);
        const checkData = await checkRes.json();
        if (checkData.error) { alert(checkData.error); return; }
        if (checkData.warning) {
          if (!confirm(checkData.warning + "\n\nTry anyway?")) return;
        }
      } catch (_) { /* network hiccup — let the download attempt give the real error */ }

      if (streamToClient) {
        const params = new URLSearchParams({ url, quality, format: fmt });
        if (noPlaylist) params.set("no_playlist", "1");
        const a = document.createElement("a");
        a.href = `/api/stream-to-client?${params}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast("Download started — check your browser's downloads");
        return;
      }
      const stopBtn = document.getElementById("stop-btn");

      btn.disabled = true;
      stopBtn.style.display = "inline-block";
      stopBtn.disabled = false;
      resetProgress();
      document.getElementById("progress-section").style.display = "block";

      if (currentSource) { currentSource.close(); currentSource = null; }
      currentJobId = null;

      let res;
      try {
        res = await fetch("/api/download", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url, quality, format: fmt, no_playlist: noPlaylist, embed_subs: embedSubs }),
        });
      } catch (e) {
        showStatus("Network error: " + e.message, "error");
        btn.disabled = false;
        stopBtn.style.display = "none";
        return;
      }

      const data = await res.json();
      if (!res.ok || data.error) {
        showStatus(data.error || "Error starting download", "error");
        btn.disabled = false;
        stopBtn.style.display = "none";
        return;
      }

      currentJobId = data.job_id;
      listenProgress(data.job_id, btn);
    }

    async function stopDownload() {
      if (!currentJobId) return;
      const stopBtn = document.getElementById("stop-btn");
      stopBtn.disabled = true;
      try {
        await fetch(`/api/cancel/${currentJobId}`, { method: "POST" });
      } catch (_) {}
      if (currentSource) { currentSource.close(); currentSource = null; }
      showStatus("Download stopped.", "error");
      document.getElementById("dl-btn").disabled = false;
      stopBtn.style.display = "none";
      stopBtn.disabled = false;
      currentJobId = null;
    }

    function listenProgress(jobId, btn) {
      const es = new EventSource(`/api/progress/${jobId}`);
      currentSource = es;
      let finished = false;

      function finalize() {
        finished = true;
        es.close();
        btn.disabled = false;
        document.getElementById("stop-btn").style.display = "none";
        currentJobId = null;
      }

      es.addEventListener("progress", e => {
        const d = JSON.parse(e.data);
        setProgress(d.percent, d.speed, d.eta, d.size);
      });

      es.addEventListener("log", e => {
        const d = JSON.parse(e.data);
        appendLog(d.text);
      });

      es.addEventListener("done", e => {
        const d = JSON.parse(e.data);
        setProgress(100);
        showStatus("Download complete" + (d.filename ? ": " + d.filename : "") + " ✓", "done");
        finalize();
        loadFiles();
      });

      es.addEventListener("error", e => {
        let msg = "Download failed.";
        try { if (e.data) msg = JSON.parse(e.data).text; } catch (_) {}
        showStatus(msg, "error");
        finalize();
      });

      es.onerror = () => {
        if (finished) return;
        if (es.readyState === EventSource.CONNECTING) return;
        showStatus("Connection lost.", "error");
        finalize();
      };
    }

    function setProgress(pct, speed, eta, size) {
      document.getElementById("progress-bar").style.width = pct + "%";
      document.getElementById("prog-percent").textContent = pct.toFixed(1) + "%";
      if (speed !== undefined) document.getElementById("prog-speed").textContent = speed;
      if (eta   !== undefined) document.getElementById("prog-eta").textContent   = "ETA " + eta;
      if (size  !== undefined) document.getElementById("prog-size").textContent  = size;
    }

    function appendLog(text) {
      if (!text) return;
      const box = document.getElementById("log-box");
      const span = document.createElement("span");
      span.className = "line";
      if (text.toLowerCase().includes("error")) span.classList.add("err");
      span.textContent = text;
      box.appendChild(span);
      box.scrollTop = box.scrollHeight;
    }

    function showStatus(msg, cls) {
      const el = document.getElementById("status-msg");
      el.textContent = msg;
      el.className = cls || "";
    }

    function resetProgress() {
      setProgress(0);
      document.getElementById("prog-speed").textContent = "";
      document.getElementById("prog-eta").textContent = "";
      document.getElementById("prog-size").textContent = "";
      document.getElementById("log-box").innerHTML = "";
      document.getElementById("status-msg").textContent = "";
      document.getElementById("status-msg").className = "";
    }

    // ── File list ─────────────────────────────────────────────────────────────
    async function loadHidden() {
      try {
        const res = await fetch("/api/hidden");
        const data = await res.json();
        (data.hidden || []).forEach(n => hiddenFiles.add(n));
      } catch (_) {}
    }

    async function loadFiles() {
      const res = await fetch("/api/files");
      const files = await res.json();
      const list = document.getElementById("file-list");
      const empty = document.getElementById("empty-msg");
      list.innerHTML = "";
      const visible = files.filter(f => !hiddenFiles.has(f.name));
      if (!visible.length) { empty.style.display = "block"; return; }
      empty.style.display = "none";
      visible.forEach(f => {
        const dotIdx = f.name.lastIndexOf(".");
        const ext = dotIdx !== -1 ? f.name.slice(dotIdx + 1).toLowerCase() : "";
        const extUpper = ext.toUpperCase();
        const li = document.createElement("li");

        const hideBtn = document.createElement("button");
        hideBtn.className = "hide-btn";
        hideBtn.title = "Hide from list";
        hideBtn.textContent = "×";
        hideBtn.addEventListener("click", () => {
          hiddenFiles.add(f.name);
          fetch("/api/hidden", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: f.name }),
          }).catch(() => {});
          li.remove();
          if (!list.children.length) document.getElementById("empty-msg").style.display = "block";
        });

        li.appendChild(hideBtn);
        li.insertAdjacentHTML("beforeend", `
          <span class="file-name" title="${esc(f.name)}">${esc(f.name)}</span>
          ${extUpper ? `<span class="file-ext">${esc(extUpper)}</span>` : ""}
          <span class="file-size">${fmtBytes(f.size)}</span>
        `);

        if (PLAYABLE_EXTS.has(ext)) {
          const playBtn = document.createElement("button");
          playBtn.className = "play-btn";
          playBtn.textContent = "Play";
          playBtn.addEventListener("click", () => openPlayer(f.name, ext, f.subtitle));
          li.appendChild(playBtn);
        }

        const dlLink = document.createElement("a");
        dlLink.href = `/downloads/${encodeURIComponent(f.name)}`;
        dlLink.className = "dl-btn";
        dlLink.download = f.name;
        dlLink.textContent = "Save";
        dlLink.addEventListener("click", async (e) => {
          if (!document.getElementById("auto-delete").checked) return;
          // Let the browser navigate to trigger the download, then delete server-side.
          // Use a short delay so the browser has time to begin receiving the file.
          setTimeout(async () => {
            try {
              const res = await fetch(`/api/files/${encodeURIComponent(f.name)}`, { method: "DELETE" });
              if (res.ok) {
                li.remove();
                if (!document.getElementById("file-list").children.length) {
                  document.getElementById("empty-msg").style.display = "block";
                }
              }
            } catch (_) {}
          }, 2000);
        });
        li.appendChild(dlLink);

        const delBtn = document.createElement("button");
        delBtn.className = "del-btn";
        delBtn.textContent = "Delete";
        delBtn.addEventListener("click", () => deleteFile(f.name, li));
        li.appendChild(delBtn);

        list.appendChild(li);
      });
    }

    async function deleteFile(name, li) {
      if (!confirm(`Delete "${name}"?`)) return;
      try {
        const res = await fetch(`/api/files/${encodeURIComponent(name)}`, { method: "DELETE" });
        if (res.ok) {
          li.remove();
          if (!document.getElementById("file-list").children.length) {
            document.getElementById("empty-msg").style.display = "block";
          }
        } else {
          const data = await res.json();
          alert(data.error || "Delete failed.");
        }
      } catch (e) {
        alert("Network error: " + e.message);
      }
    }

    // ── Media player ─────────────────────────────────────────────────────────
    function openPlayer(name, ext, subtitle) {
      const src = `/stream/${encodeURIComponent(name)}`;
      const trackEl = subtitle
        ? `<track kind="subtitles" src="/subtitles/${encodeURIComponent(subtitle)}" srclang="en" label="English" default>`
        : "";
      const container = document.getElementById("player-container");
      if (AUDIO_EXTS.has(ext)) {
        container.innerHTML = `<audio controls autoplay><source src="${src}">${trackEl}</audio>`;
      } else {
        container.innerHTML = `<video controls autoplay><source src="${src}">${trackEl}</video>`;
      }
      document.getElementById("player-title").textContent = name;
      document.getElementById("player-modal").classList.add("open");
    }

    function closePlayer() {
      document.getElementById("player-modal").classList.remove("open");
      // Stop playback by clearing the element
      document.getElementById("player-container").innerHTML = "";
    }

    // Close on backdrop click
    document.getElementById("player-modal").addEventListener("click", e => {
      if (e.target === document.getElementById("player-modal")) closePlayer();
    });

    // ── Cookies ───────────────────────────────────────────────────────────────
    function setCookiesBadge(active) {
      const badge = document.getElementById("cookies-badge");
      if (active) {
        badge.textContent = "Active";
        badge.className = "cookies-status active";
      } else {
        badge.textContent = "None";
        badge.className = "cookies-status inactive";
      }
    }

    async function loadCookiesStatus() {
      try {
        const res = await fetch("/api/cookies");
        const data = await res.json();
        setCookiesBadge(data.active);
      } catch (_) {}
    }

    async function saveCookies() {
      const content = document.getElementById("cookies-text").value.trim();
      if (!content) { alert("Paste your cookies.txt content first."); return; }
      try {
        const res = await fetch("/api/cookies", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content }),
        });
        const data = await res.json();
        if (res.ok) {
          setCookiesBadge(true);
          document.getElementById("cookies-text").value = "";
          document.getElementById("cookies-details").removeAttribute("open");
        } else {
          alert(data.error || "Failed to save cookies.");
        }
      } catch (e) {
        alert("Network error: " + e.message);
      }
    }

    async function clearCookies() {
      if (!confirm("Remove saved cookies?")) return;
      try {
        await fetch("/api/cookies", { method: "DELETE" });
        setCookiesBadge(false);
        document.getElementById("cookies-text").value = "";
      } catch (e) {
        alert("Network error: " + e.message);
      }
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function fmtBytes(b) {
      if (b > 1e9) return (b / 1e9).toFixed(1) + " GB";
      if (b > 1e6) return (b / 1e6).toFixed(1) + " MB";
      if (b > 1e3) return (b / 1e3).toFixed(1) + " KB";
      return b + " B";
    }

    function esc(s) {
      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    // Allow Enter key to trigger download
    document.getElementById("url-input").addEventListener("keydown", e => {
      if (e.key === "Enter") startDownload();
    });

    // Close player on Escape
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closePlayer();
    });

    // Init
    Promise.all([loadHidden(), loadCookiesStatus()]).then(() => loadFiles());
  </script>
</body>
</html>
