<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Downloader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0d0d;
      --surface:  #161616;
      --border:   #2a2a2a;
      --accent:   #6c63ff;
      --accent2:  #a78bfa;
      --text:     #e8e8e8;
      --muted:    #777;
      --success:  #4ade80;
      --error:    #f87171;
      --radius:   10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    header p {
      color: var(--muted);
      margin-top: 6px;
      font-size: 13px;
    }

    .card {
      width: 100%;
      max-width: 640px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    .card + .card { margin-top: 20px; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 14px;
      padding: 10px 14px;
      outline: none;
      transition: border-color .15s;
    }

    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--muted); }

    select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 13px;
      padding: 10px 12px;
      outline: none;
      cursor: pointer;
      transition: border-color .15s;
    }

    select:focus { border-color: var(--accent); }

    button {
      background: var(--accent);
      border: none;
      border-radius: 7px;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 20px;
      transition: opacity .15s, transform .1s;
      white-space: nowrap;
    }

    button:hover { opacity: .88; }
    button:active { transform: scale(.97); }
    button:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    /* Progress section */
    #progress-section { display: none; }

    .progress-bar-wrap {
      background: var(--bg);
      border-radius: 999px;
      height: 6px;
      overflow: hidden;
      margin: 14px 0 8px;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 999px;
      transition: width .3s ease;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
    }

    #log-box {
      margin-top: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 12px 14px;
      max-height: 180px;
      overflow-y: auto;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.6;
    }

    #log-box .line { display: block; }
    #log-box .line.err { color: var(--error); }
    #log-box .line.ok  { color: var(--success); }

    #status-msg {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
    }

    #status-msg.done  { color: var(--success); }
    #status-msg.error { color: var(--error); }

    /* File list */
    #files-section h2 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    #file-list { list-style: none; }

    #file-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }

    #file-list li:last-child { border-bottom: none; }

    .file-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }

    .file-size { color: var(--muted); font-size: 12px; flex-shrink: 0; }

    .dl-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--accent2);
      font-size: 12px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .dl-btn:hover { border-color: var(--accent); opacity: 1; background: var(--border); }

    #empty-msg { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0; }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .refresh-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 5px;
    }

    .refresh-btn:hover { color: var(--text); border-color: var(--accent); opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>Video Downloader</h1>
    <p>Powered by yt-dlp &mdash; saves to your server&rsquo;s downloads folder</p>
  </header>

  <!-- Download form -->
  <div class="card">
    <label for="url-input">Video URL</label>
    <div class="input-row" style="margin-bottom:14px">
      <input id="url-input" type="text" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" spellcheck="false" />
    </div>
    <label for="fmt-select">Format</label>
    <div class="input-row">
      <select id="fmt-select">
        <option value="best">Best quality (video + audio)</option>
        <option value="1080">1080p (video + audio)</option>
        <option value="720">720p (video + audio)</option>
        <option value="480">480p (video + audio)</option>
        <option value="audio">Audio only (MP3)</option>
      </select>
      <button id="dl-btn" onclick="startDownload()">Download</button>
    </div>
  </div>

  <!-- Progress -->
  <div class="card" id="progress-section">
    <label>Progress</label>
    <div class="progress-bar-wrap">
      <div id="progress-bar"></div>
    </div>
    <div class="progress-meta">
      <span id="prog-percent">0%</span>
      <span id="prog-speed"></span>
      <span id="prog-eta"></span>
      <span id="prog-size"></span>
    </div>
    <div id="log-box"></div>
    <div id="status-msg"></div>
  </div>

  <!-- Downloaded files -->
  <div class="card" id="files-section">
    <div class="section-header">
      <h2>Downloaded Files</h2>
      <button class="refresh-btn" onclick="loadFiles()">Refresh</button>
    </div>
    <ul id="file-list"></ul>
    <p id="empty-msg" style="display:none">No files yet.</p>
  </div>

  <script>
    let currentSource = null;

    async function startDownload() {
      const url = document.getElementById("url-input").value.trim();
      if (!url) { alert("Please enter a URL."); return; }

      const fmt = document.getElementById("fmt-select").value;
      const btn = document.getElementById("dl-btn");

      btn.disabled = true;
      resetProgress();
      document.getElementById("progress-section").style.display = "block";

      if (currentSource) { currentSource.close(); currentSource = null; }

      let res;
      try {
        res = await fetch("/api/download", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url, format: fmt }),
        });
      } catch (e) {
        showStatus("Network error: " + e.message, "error");
        btn.disabled = false;
        return;
      }

      const data = await res.json();
      if (!res.ok || data.error) {
        showStatus(data.error || "Error starting download", "error");
        btn.disabled = false;
        return;
      }

      listenProgress(data.job_id, btn);
    }

    function listenProgress(jobId, btn) {
      const es = new EventSource(`/api/progress/${jobId}`);
      currentSource = es;

      es.addEventListener("progress", e => {
        const d = JSON.parse(e.data);
        setProgress(d.percent, d.speed, d.eta, d.size);
      });

      es.addEventListener("log", e => {
        const d = JSON.parse(e.data);
        appendLog(d.text);
      });

      es.addEventListener("done", e => {
        const d = JSON.parse(e.data);
        setProgress(100);
        showStatus("Download complete" + (d.filename ? ": " + d.filename : "") + " ✓", "done");
        es.close();
        btn.disabled = false;
        loadFiles();
      });

      es.addEventListener("error", e => {
        let msg = "Download failed.";
        try { msg = JSON.parse(e.data).text; } catch (_) {}
        showStatus(msg, "error");
        es.close();
        btn.disabled = false;
      });

      es.onerror = () => {
        if (es.readyState === EventSource.CLOSED) return;
        showStatus("Connection lost.", "error");
        es.close();
        btn.disabled = false;
      };
    }

    function setProgress(pct, speed, eta, size) {
      document.getElementById("progress-bar").style.width = pct + "%";
      document.getElementById("prog-percent").textContent = pct.toFixed(1) + "%";
      if (speed !== undefined) document.getElementById("prog-speed").textContent = speed;
      if (eta   !== undefined) document.getElementById("prog-eta").textContent   = "ETA " + eta;
      if (size  !== undefined) document.getElementById("prog-size").textContent  = size;
    }

    function appendLog(text) {
      if (!text) return;
      const box = document.getElementById("log-box");
      const span = document.createElement("span");
      span.className = "line";
      if (text.toLowerCase().includes("error")) span.classList.add("err");
      span.textContent = text;
      box.appendChild(span);
      box.scrollTop = box.scrollHeight;
    }

    function showStatus(msg, cls) {
      const el = document.getElementById("status-msg");
      el.textContent = msg;
      el.className = cls || "";
    }

    function resetProgress() {
      setProgress(0);
      document.getElementById("prog-speed").textContent = "";
      document.getElementById("prog-eta").textContent = "";
      document.getElementById("prog-size").textContent = "";
      document.getElementById("log-box").innerHTML = "";
      document.getElementById("status-msg").textContent = "";
      document.getElementById("status-msg").className = "";
    }

    async function loadFiles() {
      const res = await fetch("/api/files");
      const files = await res.json();
      const list = document.getElementById("file-list");
      const empty = document.getElementById("empty-msg");
      list.innerHTML = "";
      if (!files.length) { empty.style.display = "block"; return; }
      empty.style.display = "none";
      files.forEach(f => {
        const li = document.createElement("li");
        li.innerHTML = `
          <span class="file-name" title="${esc(f.name)}">${esc(f.name)}</span>
          <span class="file-size">${fmtBytes(f.size)}</span>
          <a href="/downloads/${encodeURIComponent(f.name)}" class="dl-btn" download>Save</a>
        `;
        list.appendChild(li);
      });
    }

    function fmtBytes(b) {
      if (b > 1e9) return (b / 1e9).toFixed(1) + " GB";
      if (b > 1e6) return (b / 1e6).toFixed(1) + " MB";
      if (b > 1e3) return (b / 1e3).toFixed(1) + " KB";
      return b + " B";
    }

    function esc(s) {
      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    // Allow Enter key to trigger download
    document.getElementById("url-input").addEventListener("keydown", e => {
      if (e.key === "Enter") startDownload();
    });

    loadFiles();
  </script>
</body>
</html>
